<template id="art-styles-popover">
    <style>
        @scope {
            fieldset {
                border: none;
            }
        }
    </style>
    <dialog id="art-styles-menu" popover>
        <fieldset class="grid row m-0">
            <label for="is-Anime"><input type="checkbox" name="is-Anime" id="is-Anime" entry-action="toggleartstyle" entry-action-trigger="change">
                Anime</label>
            <label for="is-Cartoon"><input type="checkbox" name="is-Cartoon" id="is-Cartoon" entry-action="toggleartstyle" entry-action-trigger="change">
                Cartoon</label>
            <label for="is-Handdrawn"><input type="checkbox" name="is-Handdrawn" id="is-Handdrawn" entry-action="toggleartstyle" entry-action-trigger="change">
                Hand drawn</label>
            <label for="is-Digital"><input type="checkbox" name="is-Digital" id="is-Digital" entry-action="toggleartstyle" entry-action-trigger="change">
                Digitally drawn </label>
            <label for="is-CGI"><input type="checkbox" name="is-CGI" id="is-cgi" entry-action="toggleartstyle" entry-action-trigger="change"> Cgi</label>
            <label for="is-2D"><input type="checkbox" name="is-2D" id="is-2D" entry-action="toggleartstyle" entry-action-trigger="change"> 2D</label>
            <label for="is-3D"><input type="checkbox" name="is-3D" id="is-3D" entry-action="toggleartstyle" entry-action-trigger="change"> 3D</label>
            <label for="is-Liveaction"><input type="checkbox" id="is-Liveaction" entry-action="toggleartstyle" entry-action-trigger="change"> Live action</label>
        </fieldset>
    </dialog>
</template>
