<template id="item-card">
    <link rel="stylesheet" href="/css/colors.css">
    <link rel="stylesheet" href="/css/general.css">
    <style>
        :host(.image-only) :not(:has(picture), picture, picture *, img, p:has([name="username"]), [name="username"]) {
            display: none;
        }

        :host {
            height: 100%;
        }

        :host(.image-only) :has(slot[name="thumbnail"]) {
            height: 100%;
        }

        article {
            text-align: center;
            display: flex;
            flex-direction: column;
            max-width: 25ch;
        }

        picture {
            display: block;
            height: 100%;
            align-content: center;
        }

        ::slotted(img) {
            max-height: 150px;
            max-width: 100%;
            box-shadow: 1px 1px 3px currentColor;
            vertical-align: middle;
        }
        button:has(h2) {
            display: block;
            margin-block: var(--very-small-gap);
            text-align: center;
        }
        h2 {
            overflow: clip;
            text-overflow: ellipsis;
            text-wrap: nowrap;
        }
    </style>
    <article>
        <p class="m-0"><slot name="username"></slot></p>
        <button entry-action="openitem" class="styleless-button">
            <picture>
                <slot name="thumbnail"></slot>
            </picture>
        </button>
        <button entry-action="openitem" class="styleless-button">
            <h2 class="m-0"><slot name="title" put-data="En_Title"></slot></h2>
        </button>
        <div class="flex overflow j-center x-small-gap"><slot name="progress"></slot></div>
        <p class="m-0">
            <slot name="rating" put-data="UserRating"></slot>
            (<slot name="view-count" put-data="ViewCount"></slot>)
        </p>
    </article>
</template>
