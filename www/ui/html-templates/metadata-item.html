<template id="metadata-item">

<link rel="stylesheet" href="/css/colors.css">
<link rel="stylesheet" href="/css/general.css">

<style>
[contenteditable] {
    text-decoration: underline dotted;
}

*:empty {
    border: 1px dotted;
}

[empty-placeholder]:empty::before {
    content: attr(empty-placeholder);
    color: hsl(from currentColor h s l / 50%);
    text-decoration: none;
}

#genres {
    list-style: none;
    display: flex;
    flex-direction: row;
    gap: var(--very-small-gap);

    > li {
        display: flex;
        flex-direction: row-reverse;
    }
}

</style>

<input type="file" hidden id="thumbnail-file-upload">

<figure style="float: left; margin: 1ex 2ch;">
    <figcaption style="text-align: center;">thumbnail</figcaption>
    <button class="styleless-button" entry-action="setthumbnail">
        <img src="" alt="" class="thumbnail" id="thumbnail" loading="lazy" height="200">
    </button>
</figure>

<figure style="float: right; margin: 1ex 2ch;">
    <figcaption style="text-align: center;">Media Dependant Datapoints</figcaption>
    <table id="media-dependant">
        <thead>
            <tr>
                <th> Name
                <th> Value
        </thead>
        <tbody>
        </tbody>
        <tfoot>
            <tr>
                <td> <button entry-action="addrow" entry-action-target="#media-dependant tbody">+</button>
        </tfoot>
    </table>
</figure>


<textarea
    put-data="Title"
    entry-action="save"
    entry-action-trigger="change"
    placeholder="title"
    cols="30"
></textarea>
<br>
<textarea
    put-data="meta.Native_Title"
    entry-action="save"
    entry-action-trigger="change"
    entry-action-save="Native_Title"
    placeholder="native title"
    cols="30"
></textarea>

<p>(id: <span put-data="ItemId"></span>)</p>

<p>
    Released in
    <input
        put-data="ReleaseYear"
        put-data-mode="value"
        type="number"
        entry-action="save"
        entry-action-trigger="change"
        value="0"
        style="width: 12ch;"
    >
</p>
<p>
    Rated
    <input
        put-data="Rating"
        put-data-mode="value"
        type="number"
        entry-action="save"
        entry-action-trigger="change"
        value="0"
        style="width: 12ch;"
    >
    /
    <input
        put-data="RatingMax"
        put-data-mode="value"
        type="number"
        entry-action="save"
        entry-action-trigger="change"
        value="10"
        style="width: 12ch;"
    >

    (<span id="rating-percent"></span>%)
</p>

<p>
    Genres <button id="create-genre">+</button>
    <ul id="genres">
    </ul>
</p>

<br>

<textarea
    put-data="Description"
    entry-action="save"
    entry-action-trigger="change"
    cols="80"
    rows="20"
></textarea>

<br>

<label>provider <input id="provider" list="providers" placeholder="provider" entry-action-save="Provider" entry-action="save" entry-action-trigger="change"></label> (<input put-data="ProviderID" put-data-mode="value" entry-action="save" entry-action-trigger="change" toggle-hint="provider-id-hint">)
<span id="provider-id-hint" popover='hint'>Provider id</span>

<datalist id="providers">
    <option value="anilist"></option>
    <option value="omdb"></option>
    <option value="googlebooks"></option>
    <option value="steam"></option>
    <option value="googlebooks"></option>
    <option value="wikipedia"></option>
    <option value="gtdbgamecube"></option>
    <option value="gtdbswitch"></option>
    <option value="gtdbcube"></option>
    <option value="gtdbcustom"></option>
    <option value="gtdbds"></option>
    <option value="gtdbwiiu"></option>
    <option value="gtdbwii"></option>
    <option value="gtdbps3"></option>
    <option value="seerr"></option>
    <option value="radarr"></option>
</datalist>


</template>
